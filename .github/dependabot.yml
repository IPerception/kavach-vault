# Dependency updates, grouped so they arrive as a few reviewable PRs.
#
# Grouping is the whole point of this file. Alerts were switched on with 25
# already open, all of them in the frontend lockfile, and ungrouped that is 25
# separate pull requests against a repo with no other traffic.
#
# The non-obvious part: `groups` applies to version updates ONLY unless you say
# otherwise. Security PRs (the ones the 25 open alerts will generate) need an
# explicit `applies-to: security-updates`, or they arrive one per advisory no
# matter what is configured below.
#
# Majors are NOT grouped, except within the lockstep families listed in the
# npm section. The catch-all version-update groups only take minor and
# patch updates, so every other major (React, Tailwind, Spring Boot, ...) arrives as
# its own PR and gets its own CI run. Grouped PRs #3, #4 and #5 carried
# React 19, Tailwind 4, TypeScript 7 and Spring Boot 4 together, were merged
# without a build, and broke main. Majors are ungrouped rather than
# ignored on purpose: an ignore rule might also hold back a security fix that
# needs a major bump (the zod 3 -> 4 advisory was one).
version: 2
updates:
  # ---- frontend (npm) ------------------------------------------------
  # Every current alert lives here. Production and development are split
  # because they warrant different reading: a CVE in something that ships to
  # users is a different question from one in the test runner. The lone
  # critical so far is vitest, which only bites while its UI server is
  # listening on a developer's machine.
  - package-ecosystem: "npm"
    directory: "/kavach-frontend"
    schedule:
      interval: "monthly"
    groups:
      npm-production-security:
        applies-to: security-updates
        dependency-type: "production"
        patterns: ["*"]
      npm-development-security:
        applies-to: security-updates
        dependency-type: "development"
        patterns: ["*"]
      # Lockstep families: packages whose peer dependencies pin each other, so
      # bumping one alone always fails `npm ci` with ERESOLVE. They are grouped
      # INCLUDING majors (no update-types), and listed before the catch-all
      # groups because a dependency goes to the first group it matches.
      # Found the hard way: vitest 5 and @vitest/coverage-v8 5 arrived as two
      # PRs (#23, #24) and each failed CI for lack of the other.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        applies-to: version-updates
        patterns: ["vite", "@vitejs/*"]
      tailwind:
        applies-to: version-updates
        patterns: ["tailwindcss", "@tailwindcss/*"]
      npm-production:
        applies-to: version-updates
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Bump"

  # ---- backend and build (maven) -------------------------------------
  # Three poms, all worth watching for different reasons:
  #   /                  aggregator: no dependencies, but it pins
  #                      spring-boot-starter-parent, which Dependabot updates,
  #                      and holds the <properties> versions the backend reads
  #   /kavach-backend    the real tree: 21 dependencies, 5 plugins
  #   /kavach-frontend   no dependencies, but frontend-maven-plugin and friends
  #
  # Caveat to expect rather than be surprised by: a version declared as
  # ${foo.version} in the backend but *defined* in the root pom is the case
  # Dependabot handles least reliably. If a backend bump ever looks like it was
  # skipped, that is the first thing to check by hand.
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/kavach-backend"
      - "/kavach-frontend"
    schedule:
      interval: "monthly"
    groups:
      maven-security:
        applies-to: security-updates
        patterns: ["*"]
      maven:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Bump"

  # ---- CI --------------------------------------------------------------
  # Watches the actions pinned in .github/workflows/ (major tags, e.g. @v7).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
